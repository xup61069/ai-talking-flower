[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-talking-flower"
version = "0.1.0"
description = "Windows local voice companion using Volt 1, FunASR, llama.cpp and pluggable TTS"
requires-python = ">=3.11,<3.14"
dependencies = [
  "httpx>=0.28,<1",
  "numpy>=2,<3",
  "opencc-python-reimplemented>=0.1.7,<1",
  "sounddevice>=0.5.5,<1",
]

[project.optional-dependencies]
asr = [
  "funasr>=1.3.16,<2",
  "torch>=2.7",
]
vad = [
  "ten-vad @ git+https://github.com/TEN-framework/ten-vad.git",
]
windows = [
  "pywin32>=311",
]
ui = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.scripts]
talking-flower = "talking_flower.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
