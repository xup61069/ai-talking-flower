[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-talking-flower"
version = "0.1.0"
description = "Windows local voice companion using Volt 1, FunASR, llama.cpp and pluggable TTS"
requires-python = ">=3.11,<3.14"
dependencies = [
  "httpx>=0.28,<1",
  "numpy>=2,<3",
  "opencc-python-reimplemented>=0.1.7,<1",
  "scipy>=1.13,<2",
  "soxr>=0.3,<1",
  "sounddevice>=0.5.5,<1",
]

[project.optional-dependencies]
asr = [
  "funasr>=1.3.16,<2",
  "torch>=2.7",
]
vad = [
  "ten-vad @ git+https://github.com/TEN-framework/ten-vad.git",
]
windows = [
  "pywin32>=311",
]
ui = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
]
pet = [
  "PySide6>=6.6,<7",
  "pystray>=0.19,<1",
  "Pillow>=10,<12",
  "pynput>=1.7,<2",
]

[project.scripts]
talking-flower = "talking_flower.main:main"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# 務實門檻：只擋真錯誤（語法錯誤、未定義名稱、未使用 import），
# 排版類（I001 import 排序、E501 行長等）不設門檻，避免歷史碼大改
select = ["E9", "F"]
ignore = []

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
