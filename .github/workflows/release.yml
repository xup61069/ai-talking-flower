name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
      - name: Build wheel & sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Build portable zip
        shell: pwsh
        run: |
          $stage = "ai-talking-flower-$($env:GITHUB_REF_NAME)"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          # 原始碼 + UI + 工具腳本（不含模型/原生 DLL/聲音樣本/資料）
          Copy-Item src, ui, tools, config.toml, pyproject.toml, README.md, LICENSE, CHANGELOG.md, run.cmd, run.ps1 -Destination $stage -Recurse -Force
          Copy-Item native/THIRD-PARTY-NOTICES.txt -Destination "$stage/native/" -Force
          New-Item -ItemType Directory -Force -Path "$stage/native" | Out-Null
          if (Test-Path "native/THIRD-PARTY-NOTICES.txt") {
            Copy-Item "native/THIRD-PARTY-NOTICES.txt" -Destination "$stage/native/" -Force
          }
          Compress-Archive -Path $stage -DestinationPath "$stage.zip" -Force
          Remove-Item -Recurse -Force $stage
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: CHANGELOG.md
          files: |
            dist/*.whl
            dist/*.tar.gz
            ai-talking-flower-*.zip
