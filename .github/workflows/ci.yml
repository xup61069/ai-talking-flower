name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
      - name: Install ruff
        run: pip install ruff
      - name: Lint (ruff)
        run: ruff check src tests

  core:
    runs-on: windows-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
      - name: Install core deps
        run: |
          python -m pip install --upgrade pip
          pip install .[ui]
          pip install scipy soxr ruff
      - name: Core unit tests
        run: python -m unittest discover -s tests -v

  heavy:
    runs-on: windows-latest
    if: contains(github.event.head_commit.message, '[heavy]')
    needs: core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
      - name: Install heavy deps
        run: |
          python -m pip install --upgrade pip
          pip install .[asr,vad,windows,ui]
          pip install scipy soxr ruff torch --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Heavy integration tests
        run: python -m unittest discover -s tests -v
        env:
          HEAVY: "1"
